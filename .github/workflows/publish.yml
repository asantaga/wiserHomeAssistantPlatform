name: Publish

on:
  release:
    types: [published]
  push:
    branches: [test-build]
  workflow_dispatch:
    inputs:
      channel:
        description: Card release channel to test (does not publish a release)
        type: choice
        options: [dev, stable]
        default: dev

permissions:
  contents: read

jobs:
  package:
    name: Build Wiser integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Run complete test suite
        run: python -m unittest discover -s tests
      - name: Build integration with published card releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARD_CHANNEL: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'dev' || 'stable') || inputs.channel || 'dev' }}
        run: >-
          python scripts/build.py --release
          --channel "$CARD_CHANNEL"
      - name: Upload release package for inspection
        uses: actions/upload-artifact@v7
        with:
          name: wiser-package
          path: |
            dist/wiser.zip
            dist/card-releases.json
          if-no-files-found: error

  publish:
    name: Attach package to published release
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wiser-package
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/wiser.zip
          fail_on_unmatched_files: true
