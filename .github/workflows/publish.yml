name: Publish

on:
  release:
    types: [published]
  push:
    branches: [test-build]
  workflow_dispatch:
    inputs:
      channel:
        description: Card release channel to test (does not publish a release)
        type: choice
        options: [dev, stable]
        default: dev

permissions:
  contents: read

jobs:
  package:
    name: Build Wiser integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Test packaging and sidebar integration
        run: |
          python -m unittest discover -s tests -p test_card_releases.py
          python -m unittest discover -s tests -p test_build.py
          python -m unittest discover -s tests -p test_card_updates.py
          python -m unittest discover -s tests -p test_ui_options.py
          python -m unittest discover -s tests -p test_sidebar_icons.py
          python -m unittest discover -s tests -p 'test_*sidebar.py'
          python -m unittest discover -s tests -p 'test_*version.py'
      - name: Build integration with published card releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARD_CHANNEL: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'dev' || 'stable') || inputs.channel || 'dev' }}
          SCHEDULE_REPOSITORY: ${{ vars.WISER_SCHEDULE_CARD_REPOSITORY || 'andyblac/wiser-schedule-card' }}
          ZIGBEE_REPOSITORY: ${{ vars.WISER_ZIGBEE_CARD_REPOSITORY || 'andyblac/wiser-zigbee-card' }}
        run: >-
          python scripts/build.py --release
          --channel "$CARD_CHANNEL"
          --schedule-repository "$SCHEDULE_REPOSITORY"
          --zigbee-repository "$ZIGBEE_REPOSITORY"
      - name: Upload release package for inspection
        uses: actions/upload-artifact@v5
        with:
          name: wiser-package
          path: |
            dist/wiser.zip
            dist/card-releases.json
          if-no-files-found: error

  publish:
    name: Attach package to published release
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: wiser-package
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/wiser.zip
          fail_on_unmatched_files: true
